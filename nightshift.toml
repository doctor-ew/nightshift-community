# Portable Nightshift factory configuration. Validate with:
# scripts/nightshift-manifest-validate.sh --project .

[ticket_source]
provider = "beads"

[deployments.production]
name = "production"
url = "https://example.invalid"
health_path = "/health"

[providers]
routing_file = "routing.json"

# Optional launcher aliases. Project or ~/.nightshift/.nightshift.toml settings
# override these mappings. The default factory remains the configured runtime.
[runtime.aliases.qwen]
provider = "local"
model = "qwen3-coder:30b"

[runtime.aliases.devstral]
provider = "local"
model = "devstral-small-2:24b"

[repair_budgets]
implement = 0
review = 0
drift = 0
qa = 0

[policy]
require_production_confirmation = true
require_removal_confirmation = true
allow_heuristic_production_target = false

# Optional: omitted work/time/count limits have no ceiling.
[behavior_proof]
version = 1
timeout_seconds = 0
output_bytes = 1048576
force_prompt = false

# Display only; investigation scope and provider routing are independent.
# Omit mode to inherit a saved user preference; otherwise defaults to concise.
# [output]
# mode = "concise"
