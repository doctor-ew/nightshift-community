name: Tag verified release
on:
  workflow_run:
    workflows: [shellcheck]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag exact verified main revision
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\n' < VERSION)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main --tags
          git merge-base --is-ancestor "$VERIFIED_SHA" origin/main
          TAG="v$VERSION"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; bump VERSION to publish another release. Never moving a release tag."
            exit 0
          fi
          git config user.name 'Nightshift releases'
          git config user.email 'noreply@users.noreply.github.com'
          git tag -a "$TAG" "$VERIFIED_SHA" -m "Nightshift $VERSION — verified main release"
          git push origin "refs/tags/$TAG"
